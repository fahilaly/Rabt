<title>Rabt Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: inverted-L console. Fixed left sidebar (role, sections, demo clock), work area of
   dense tables. The recovery ward is a dark departures board (FIDS style, Arabic + English
   headers), deliberately dark in both themes. */
:root {
  --bg: #ffffff;
  --side: #f5f5f2;
  --sunk: #f3f3f0;
  --hover: #f6f6f3;
  --ink: #171a18;
  --ink-2: #555b57;
  --ink-3: #868b87;
  --line: #e4e4df;
  --line-2: #cdcdc6;
  --accent: #006c35;
  --accent-hover: #005a2c;
  --accent-ink: #ffffff;
  --accent-tint: #e8f3ec;
  --amber: #a85a00;
  --amber-tint: #fdf3e3;
  --red: #c0261d;
  --red-tint: #fdeceb;
  --blue: #1f5fbf;
  --blue-tint: #ebf1fb;
  --focus: #f2c200;
  --scrim: rgba(23, 26, 24, 0.28);

  /* board is always dark */
  --b-bg: #0c0e0d;
  --b-row: #121513;
  --b-line: #242926;
  --b-text: #ecebe4;
  --b-dim: #8d928c;
  --b-yellow: #f5c542;
  --b-red: #ff5f52;
  --b-green: #57d08b;

  --sans: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --arabic: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121413;
    --side: #171a18;
    --sunk: #1b1e1c;
    --hover: #1a1d1b;
    --ink: #e9ebe9;
    --ink-2: #a7ada9;
    --ink-3: #7c827e;
    --line: #2a2e2b;
    --line-2: #3b403d;
    --accent: #3fb77a;
    --accent-hover: #52c98b;
    --accent-ink: #07210f;
    --accent-tint: #15301f;
    --amber: #f0a93e;
    --amber-tint: #2c2210;
    --red: #ff7468;
    --red-tint: #321816;
    --blue: #7aa7ff;
    --blue-tint: #172338;
    --scrim: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121413;
  --side: #171a18;
  --sunk: #1b1e1c;
  --hover: #1a1d1b;
  --ink: #e9ebe9;
  --ink-2: #a7ada9;
  --ink-3: #7c827e;
  --line: #2a2e2b;
  --line-2: #3b403d;
  --accent: #3fb77a;
  --accent-hover: #52c98b;
  --accent-ink: #07210f;
  --accent-tint: #15301f;
  --amber: #f0a93e;
  --amber-tint: #2c2210;
  --red: #ff7468;
  --red-tint: #321816;
  --blue: #7aa7ff;
  --blue-tint: #172338;
  --scrim: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--side); }
button, input, select { font: inherit; color: inherit; }
h1, h2 { margin: 0; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 1.4rem; }
h2 { font-size: 0.95rem; }
p { margin: 0; }
svg { flex: none; vertical-align: -2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.93em; }
.dim { color: var(--ink-2); }
.small { font-size: 0.86rem; }
.strong { font-weight: 600; }
.name { font-weight: 500; }
.r { text-align: right; }
.pad { padding: 12px 14px; }
.t-red { color: var(--red); }
.t-amber { color: var(--amber); }
.t-blue { color: var(--blue); }
.label { display: block; font-size: 0.78rem; color: var(--ink-2); font-weight: 500; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  height: calc(100vh - env(safe-area-inset-top, 0px));
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-block: 14px 16px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: 14px;
  background: var(--side);
  border-right: 1px solid var(--line);
  z-index: 20;
}
.side-top { display: flex; align-items: center; justify-content: space-between; }
.wordmark { display: flex; align-items: baseline; gap: 8px; padding-left: 2px; }
.wm-ar { font-family: var(--arabic); font-weight: 700; font-size: 1.35rem; color: var(--accent); line-height: 1; }
.wm-en { font-weight: 600; font-size: 1.02rem; letter-spacing: -0.01em; }
.side-who { display: grid; gap: 4px; }
.role-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line-2); border-radius: 4px; background: var(--bg); overflow: hidden; }
.role-switch button { border: 0; border-left: 1px solid var(--line-2); background: none; padding: 7px 4px; font-size: 0.84rem; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.role-switch button:first-child { border-left: 0; }
.role-switch button:hover { color: var(--ink); background: var(--hover); }
.role-switch button.on { background: var(--ink); color: var(--bg); }
.side-nav { display: grid; gap: 1px; }
.nav-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  border: 0;
  background: none;
  text-align: left;
  padding: 7px 10px;
  border-radius: 4px;
  cursor: pointer;
  color: var(--ink-2);
  font-weight: 500;
}
.nav-item:hover { background: var(--hover); color: var(--ink); }
.nav-item.on { background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.nav-count { font-size: 0.8rem; color: var(--ink-3); }
.nav-count.alert { color: var(--amber); font-weight: 600; }
.side-foot { margin-top: auto; display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.clock { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.clock-time { font-size: 1rem; }
.clock-actions { display: flex; gap: 6px; }
.bell { position: relative; }
.bell .dot {
  position: absolute;
  top: 1px;
  right: 0;
  background: var(--red);
  color: #fff;
  font-size: 0.66rem;
  line-height: 16px;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  text-align: center;
  padding: 0 4px;
}
.bell.on { background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); }
.inbox {
  position: absolute;
  left: calc(100% + 8px);
  top: 10px;
  width: 360px;
  max-height: calc(100vh - 40px);
  overflow: auto;
  background: var(--bg);
  border: 1px solid var(--line-2);
  border-radius: 6px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  z-index: 60;
}
.inbox-head { padding: 10px 14px; font-weight: 600; border-bottom: 1px solid var(--line); }

.content { min-width: 0; padding-block: 26px 48px; padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); }
.content-board { padding: 0; }
.page { display: grid; gap: 22px; max-width: 1160px; }
.page.narrow { max-width: 620px; }

/* ---------- page header ---------- */
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.ph-text { display: grid; gap: 4px; min-width: 0; }
.ph-meta { color: var(--ink-2); }
.ph-actions { display: flex; gap: 8px; }
.block { display: grid; gap: 10px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.alert-bar { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 14px; margin-bottom: 18px; max-width: 1160px; background: var(--red-tint); color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 30%, transparent); border-radius: 4px; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  border: 1px solid var(--line-2);
  border-radius: 4px;
  background: var(--bg);
  color: var(--ink);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 0.86rem; }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.icon-btn { border: 0; background: none; border-radius: 4px; padding: 6px; cursor: pointer; display: inline-flex; color: var(--ink-2); }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-align: left; }
.link.name { color: var(--ink); text-decoration-color: var(--line-2); }
.link.name:hover { text-decoration-color: currentColor; }
.select, .input {
  width: 100%;
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--line-2);
  border-radius: 4px;
  background: var(--bg);
  color: var(--ink);
  min-width: 0;
}
.select.sm { height: 28px; width: auto; max-width: 240px; font-size: 0.86rem; }
.input:focus, .select:focus { outline: 2px solid var(--focus); outline-offset: 0; }
.search { display: flex; align-items: center; gap: 6px; height: 32px; border: 1px solid var(--line-2); border-radius: 4px; padding: 0 10px; flex: 0 1 280px; min-width: 0; color: var(--ink-3); }
.search input { border: 0; background: none; outline: none; width: 100%; min-width: 0; color: var(--ink); }
.filters { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.tabs { display: flex; gap: 18px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 6px 0; border-bottom: 2px solid transparent; color: var(--ink-2); cursor: pointer; font-weight: 500; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
.field { display: grid; gap: 4px; flex: 1 1 220px; }
.form { display: grid; gap: 16px; }
.form-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.radios { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.radios.inline { display: flex; flex-wrap: wrap; gap: 6px 20px; }
.radios.inline legend { width: 100%; margin-bottom: 4px; }
.radios legend { padding: 0; margin-bottom: 2px; }
.radio, .check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.radio input, .check input { margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.checks { display: grid; gap: 10px; }
.driver-opt { padding: 8px 0; border-bottom: 1px solid var(--line); }
.driver-opt > span:nth-of-type(1) { flex: 1; min-width: 0; }
.opt-where { display: block; }
.opt-eta { display: grid; justify-items: end; text-align: right; }

/* ---------- status ---------- */
.status { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 1px; background: currentColor; flex: none; }
.s-grey { color: var(--ink-2); }
.s-grey i { background: var(--ink-3); }
.s-amber { color: var(--amber); }
.s-blue { color: var(--blue); }
.s-done { color: var(--ink-2); }
.s-done i { background: var(--accent); }
.s-red { color: var(--red); font-weight: 600; }

/* ---------- tables ---------- */
.table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
.table { width: 100%; border-collapse: collapse; min-width: 680px; }
.table th {
  text-align: left;
  font-weight: 500;
  font-size: 0.8rem;
  color: var(--ink-2);
  padding: 8px 12px;
  background: var(--sunk);
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.table td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: baseline; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: var(--hover); }
.table th.r, .table td.r { text-align: right; white-space: nowrap; }
.actions-col { width: 1%; white-space: nowrap; }
.row-actions { display: flex; gap: 6px; align-items: center; }
.empty-row td { color: var(--ink-2); padding: 18px 12px; }

/* ---------- drawer, modal ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 80; display: flex; justify-content: flex-end; }
.scrim.center { justify-content: center; align-items: flex-start; padding: 10vh 16px 16px; }
.drawer {
  width: min(440px, 100%);
  height: 100%;
  background: var(--bg);
  border-left: 1px solid var(--line-2);
  display: flex;
  flex-direction: column;
  outline: none;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 20px 14px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { font-size: 1.1rem; margin-bottom: 4px; }
.drawer-body { overflow-y: auto; flex: 1; }
.d-sec { padding: 16px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.d-sec:last-child { border-bottom: 0; }
.d-sec .btn.primary { justify-self: start; }
.modal { width: min(500px, 100%); max-height: 85vh; overflow: auto; background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16); outline: none; }
.modal-body { padding: 16px 20px 20px; display: grid; gap: 16px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.modal-actions.start { justify-content: flex-start; }
.dl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 7px 14px; margin: 0; }
.dl dt { color: var(--ink-2); }
.dl dd { margin: 0; }
.note { padding: 8px 10px; border-radius: 4px; background: var(--sunk); }
.note.amber { background: var(--amber-tint); color: var(--amber); }
.note.red { background: var(--red-tint); color: var(--red); }
.steps-row { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.steps-row li { display: grid; gap: 2px; padding: 8px 6px 0 0; border-top: 2px solid var(--line); color: var(--ink-3); font-size: 0.8rem; }
.steps-row li.done { border-top-color: var(--accent); color: var(--ink); }
.steps-time { font-size: 0.82rem; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.timeline li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; }
.timeline time { color: var(--ink-2); }
.privacy { display: grid; gap: 4px; }
.privacy p { margin-bottom: 8px; }
.notices { list-style: none; margin: 0; padding: 0; }
.notice { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 14px; cursor: pointer; }
.notice:hover { background: var(--hover); }
.notice-icon { color: var(--ink-3); padding-top: 1px; }
.n-warn .notice-icon { color: var(--amber); }
.n-good .notice-icon { color: var(--accent); }
.notice-time { font-size: 0.78rem; }
.result { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line-2); border-radius: 4px; }
.result-name { font-size: 1.05rem; font-weight: 600; }

/* ---------- recovery ward: departures board ---------- */
.board {
  min-height: 100vh;
  background: var(--b-bg);
  color: var(--b-text);
  display: flex;
  flex-direction: column;
  color-scheme: dark;
}
.board-full { position: fixed; inset: 0; z-index: 70; overflow: auto; padding-top: env(safe-area-inset-top, 0px); }
.board-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 26px 32px 18px; border-bottom: 1px solid var(--b-line); }
.board-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; font-size: 1.7rem; font-weight: 600; letter-spacing: -0.01em; }
.board-ar { font-family: var(--arabic); font-weight: 500; color: var(--b-dim); font-size: 1.4rem; }
.board-sub { color: var(--b-dim); margin-top: 4px; }
.board-right { display: flex; align-items: center; gap: 18px; }
.board-clock { font-size: 2.6rem; color: var(--b-yellow); line-height: 1; letter-spacing: 0.02em; }
.board-btn { display: inline-flex; gap: 6px; align-items: center; height: 32px; padding: 0 12px; background: none; border: 1px solid var(--b-line); border-radius: 4px; color: var(--b-text); cursor: pointer; }
.board-btn:hover { border-color: var(--b-dim); }
.board-summary { display: flex; gap: 28px; flex-wrap: wrap; padding: 12px 32px; border-bottom: 1px solid var(--b-line); color: var(--b-dim); font-size: 0.95rem; }
.board-summary b { color: var(--b-text); font-weight: 500; font-size: 1.1rem; }
.board-summary .b-red, .board-summary .b-red b { color: var(--b-red); }
.board-scroll { overflow-x: auto; flex: 1; }
.board-table { width: 100%; border-collapse: collapse; min-width: 820px; font-size: 1.02rem; }
.board-table th {
  vertical-align: bottom;
  text-align: left;
  font-weight: 500;
  font-size: 0.74rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--b-dim);
  padding: 12px 16px;
  border-bottom: 1px solid var(--b-line);
  white-space: nowrap;
}
.board-table th span { display: block; margin-top: 3px; font-family: var(--arabic); text-transform: none; letter-spacing: 0; font-size: 0.86rem; font-weight: 500; opacity: 0.75; }
.board-table td { padding: 15px 16px; border-bottom: 1px solid var(--b-line); white-space: nowrap; }
.board-table tbody tr { cursor: pointer; }
.board-table tbody tr:nth-child(even) td { background: var(--b-row); }
.board-table tbody tr:hover td { background: #1a1e1b; }
.board-table .c-time { width: 1%; }
.board-table td.c-time { color: var(--b-yellow); }
.board-table .c-num { text-align: right; width: 1%; }
.board-table th.c-num { text-align: right; }
.b-name { font-weight: 500; }
.b-chair { margin-left: 8px; color: var(--b-yellow); }
.b-dim { color: var(--b-dim); }
.b-status { font-weight: 500; }
.b-amber { color: var(--b-yellow); }
.b-red { color: var(--b-red); }
.b-green { color: var(--b-green); }
.b-white { color: var(--b-text); }
.b-wait { font-size: 1.25rem; }
.b-est { color: var(--b-dim); }
.row-late td { background: rgba(255, 95, 82, 0.08) !important; }
.row-left td { color: #5d625e; }
.row-left td.c-time { color: #6f6a55; }
.b-empty { color: var(--b-dim); padding: 28px 16px !important; }
.board-foot { padding: 14px 32px 20px; color: var(--b-dim); font-size: 0.85rem; border-top: 1px solid var(--b-line); }

/* ---------- driver phone ---------- */
.driver-layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 32px; align-items: start; }
.phone { border: 1px solid var(--line-2); border-radius: 28px; padding: 10px; background: var(--side); }
.phone-status { display: flex; justify-content: space-between; padding: 6px 14px 10px; color: var(--ink-2); font-size: 0.78rem; }
.phone-body { display: grid; gap: 10px; min-height: 420px; align-content: start; }
.phone-empty { color: var(--ink-2); padding: 40px 18px; text-align: center; }
.trip { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.trip-late { border-color: var(--red); }
.trip-step { font-size: 0.78rem; font-weight: 600; color: var(--accent); }
.trip-name { font-size: 1.15rem; font-weight: 600; line-height: 1.2; }
.trip-co { color: var(--ink-2); margin-top: -6px; }
.trip-legs { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px 8px; margin: 0; }
.trip-legs dt { color: var(--ink-3); }
.trip-legs dd { margin: 0; }
.trip-phone { display: block; color: var(--ink-2); }
.trip-flag { color: var(--blue); font-weight: 500; }
.trip-q { font-weight: 500; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.trip-est { font-weight: 400; font-size: 0.82rem; color: var(--ink-2); }
.eta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.eta button { height: 40px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); cursor: pointer; font-weight: 500; }
.eta button.on { border-color: var(--accent); background: var(--accent-tint); color: var(--accent); }
.trip-btn { height: 48px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 1rem; cursor: pointer; }
.trip-btn:hover { background: var(--accent-hover); }
.trip-due { color: var(--ink-2); }
.trip-due.late { color: var(--red); font-weight: 500; }


/* ---------- demo mode ---------- */
.demo-start { width: 100%; }
.sms-btn { justify-content: space-between; }
.sms-btn.on { background: var(--hover); }
.sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--ink-3); vertical-align: 1px; }
.sync-dot.shared { background: var(--accent); }
.content.with-demo { padding-bottom: 150px; }
.content-board.with-demo { padding-bottom: 128px; }
.with-demo .drawer-body { padding-bottom: 140px; }
.with-demo .board-full { padding-bottom: 128px; }
.demo-bar {
  position: fixed;
  left: 256px;
  right: 0;
  bottom: 0;
  z-index: 85;
  background: var(--bg);
  border-top: 1px solid var(--line-2);
  box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.1);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.demo-progress { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; height: 3px; }
.demo-progress span { background: var(--line); }
.demo-progress span.on { background: var(--accent); }
.demo-main { display: flex; gap: 20px; align-items: center; justify-content: space-between; padding: 12px 24px 14px; flex-wrap: wrap; }
.demo-text { display: grid; gap: 4px; flex: 1 1 420px; min-width: 0; }
.demo-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.demo-title b { font-size: 1.05rem; font-weight: 600; }
.demo-count { color: var(--ink-2); }
.demo-where { font-size: 0.78rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
.demo-caption { color: var(--ink-2); max-width: 80ch; }
.demo-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.demo-follow { display: flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 0.86rem; margin-right: 6px; cursor: pointer; }
.demo-follow input { accent-color: var(--accent); }

/* ---------- simulated SMS ---------- */
.sms-panel {
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: 16px;
  width: 340px;
  max-width: calc(100vw - 32px);
  max-height: min(560px, calc(100vh - 32px));
  display: flex;
  flex-direction: column;
  background: var(--side);
  border: 1px solid var(--line-2);
  border-radius: 20px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);
  z-index: 86;
  overflow: hidden;
}
.content.with-demo ~ .sms-panel { bottom: 140px; max-height: min(520px, calc(100vh - 160px)); }
.sms-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
.sms-list { overflow-y: auto; padding: 12px; display: grid; gap: 12px; align-content: start; flex: 1; }
.sms-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 0.75rem; color: var(--ink-2); margin-bottom: 4px; }
.sms-bubble { background: var(--bg); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 9px 12px; font-size: 0.9rem; }
.sms-empty { padding: 20px 4px; text-align: center; }
.sms-foot { padding: 8px 16px 12px; border-top: 1px solid var(--line); }
.sms-toast {
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(16px + env(safe-area-inset-top, 0px));
  width: 340px;
  max-width: calc(100vw - 32px);
  display: grid;
  gap: 4px;
  text-align: left;
  padding: 12px 14px;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line-2);
  border-radius: 14px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
  z-index: 90;
  cursor: pointer;
  animation: toast-in 0.25s ease-out;
}
.sms-toast-to { font-size: 0.78rem; font-weight: 600; color: var(--accent); }
.sms-toast-text { font-size: 0.9rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
@keyframes toast-in { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- narrow screens ---------- */
@media (max-width: 860px) {
  .shell { display: block; }
  .side {
    position: static;
    height: auto;
    gap: 12px;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .side-who { grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 10px; }
  .side-nav { display: flex; gap: 4px; overflow-x: auto; }
  .nav-item { white-space: nowrap; }
  .side-foot { margin-top: 0; padding-top: 10px; grid-template-columns: auto 1fr; align-items: center; }
  .side-foot p { grid-column: 1 / -1; }
  .clock-actions { justify-content: flex-end; }
  .inbox { left: 16px; right: 16px; width: auto; top: 56px; }
  .content { padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .content-board { padding: 0; }
  .board { min-height: 70vh; }
  .board-head, .board-summary, .board-foot { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .board-clock { font-size: 2rem; }
  .driver-layout { grid-template-columns: minmax(0, 1fr); }
  .table th, .table td { white-space: nowrap; }
  .phone { max-width: 380px; }
  .demo-bar { left: 0; }
  .demo-main { padding: 10px 16px 12px; gap: 10px; }
  .demo-caption { font-size: 0.88rem; }
  .side-foot .demo-start { grid-column: 1 / -1; }
  .side-foot .sms-btn { grid-column: 1 / -1; }
  .content.with-demo { padding-bottom: 230px; }
  .content-board.with-demo { padding-bottom: 210px; }
  .content.with-demo ~ .sms-panel { bottom: 220px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
