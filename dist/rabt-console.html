<title>Rabt Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Design C: Arabic first. Green sidebar on the start side (right in Arabic), white work area,
   bordered lists with small radii, one green accent. The recovery ward keeps its dark
   departures-board look. Spacing uses logical properties so Arabic (RTL) and English (LTR)
   both work from one stylesheet. */
:root {
  --bg: #ffffff;
  --sunk: #f6f7f6;
  --hover: #f3f6f4;
  --ink: #1a1f1c;
  --ink-2: #5a635e;
  --ink-3: #848b86;
  --line: #e2e5e3;
  --line-2: #c3c9c5;
  --accent: #006c35;
  --accent-hover: #00592c;
  --accent-ink: #ffffff;
  --accent-tint: #e6f2eb;
  --amber: #9a4d00;
  --amber-tint: #fdf2e2;
  --red: #a8201a;
  --red-tint: #fdecea;
  --blue: #1f5fbf;
  --focus: #f2c200;
  --scrim: rgba(26, 31, 28, 0.32);

  --side: #006c35;
  --side-ink: #ffffff;
  --side-dim: #cfe6d9;
  --side-line: #3f8f65;
  --side-hover: rgba(255, 255, 255, 0.1);

  /* board is always dark */
  --b-bg: #0c0e0d;
  --b-row: #121513;
  --b-line: #242926;
  --b-text: #ecebe4;
  --b-dim: #8d928c;
  --b-yellow: #f5c542;
  --b-red: #ff5f52;
  --b-green: #57d08b;

  --sans: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --arabic: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-sm: 6px;
  --r-md: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513;
    --sunk: #171c19;
    --hover: #1a201c;
    --ink: #e8ece9;
    --ink-2: #a5aea8;
    --ink-3: #7c857f;
    --line: #29302c;
    --line-2: #3b443e;
    --accent: #3fb77a;
    --accent-hover: #52c98b;
    --accent-ink: #07210f;
    --accent-tint: #15301f;
    --amber: #f0a93e;
    --amber-tint: #2c2210;
    --red: #ff7468;
    --red-tint: #321816;
    --blue: #7aa7ff;
    --scrim: rgba(0, 0, 0, 0.5);
    --side: #0b3f23;
    --side-dim: #a9cdb8;
    --side-line: #2c6a48;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513;
  --sunk: #171c19;
  --hover: #1a201c;
  --ink: #e8ece9;
  --ink-2: #a5aea8;
  --ink-3: #7c857f;
  --line: #29302c;
  --line-2: #3b443e;
  --accent: #3fb77a;
  --accent-hover: #52c98b;
  --accent-ink: #07210f;
  --accent-tint: #15301f;
  --amber: #f0a93e;
  --amber-tint: #2c2210;
  --red: #ff7468;
  --red-tint: #321816;
  --blue: #7aa7ff;
  --scrim: rgba(0, 0, 0, 0.5);
  --side: #0b3f23;
  --side-dim: #a9cdb8;
  --side-line: #2c6a48;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
:root[lang="ar"] body { font-family: var(--arabic); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--side); }
button, input, select { font: inherit; color: inherit; }
h1, h2 { margin: 0; font-weight: 700; text-wrap: balance; }
h1 { font-size: 1.75rem; line-height: 1.25; }
h2 { font-size: 1.1rem; }
p { margin: 0; }
svg { flex: none; vertical-align: -2px; }
[dir="rtl"] .flip { transform: scaleX(-1); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.92em; }
span.mono, .b-est { direction: ltr; unicode-bidi: isolate; }
.dim { color: var(--ink-2); }
.small { font-size: 0.86rem; }
.strong { font-weight: 600; }
.name { font-weight: 600; }
.r { text-align: end; }
.pad { padding: 12px 14px; }
.t-red { color: var(--red); }
.t-amber { color: var(--amber); }
.t-blue { color: var(--blue); }
.label { display: block; font-size: 0.8rem; color: var(--ink-2); font-weight: 500; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  height: calc(100vh - env(safe-area-inset-top, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-block: 22px 18px;
  padding-inline: 20px;
  background: var(--side);
  color: var(--side-ink);
  z-index: 20;
  overflow-y: auto;
}
.side-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.wordmark { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wm { font-family: var(--arabic); font-weight: 700; font-size: 2.1rem; line-height: 1; }
:root[lang="en"] .wm { font-family: var(--sans); font-size: 1.7rem; }
.wm-sub { font-size: 0.8rem; color: var(--side-dim); }
.side .label { color: var(--side-dim); }
.side-who { display: grid; gap: 6px; }
.side .select { background: var(--bg); color: var(--ink); border-color: transparent; }
.side-plan { font-size: 0.85rem; color: var(--side-ink); }
.side-panel { display: contents; }
.side-current, .side .menu-btn { display: none; }
.role-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--side-line); border-radius: var(--r-sm); overflow: hidden; }
.role-switch button { border: 0; border-inline-start: 1px solid var(--side-line); background: none; padding: 8px 2px; font-size: 0.9rem; color: var(--side-ink); cursor: pointer; }
.role-switch button:first-child { border-inline-start: 0; }
.role-switch button:hover { background: var(--side-hover); }
.role-switch button.on { background: var(--bg); color: var(--accent); font-weight: 700; }
.side-nav { display: grid; gap: 2px; }
.nav-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  border: 0;
  background: none;
  text-align: start;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  cursor: pointer;
  color: var(--side-ink);
  font-weight: 500;
}
.nav-item:hover { background: var(--side-hover); }
.nav-item.on { background: var(--bg); color: var(--ink); font-weight: 700; }
.nav-count { font-size: 0.82rem; color: var(--side-dim); }
.nav-item.on .nav-count { color: var(--ink-2); }
.nav-count.alert, .nav-item.on .nav-count.alert { color: #ffd27a; font-weight: 700; }
.nav-item.on .nav-count.alert { color: var(--amber); }
.side-foot { margin-top: auto; display: grid; gap: 10px; border-top: 1px solid var(--side-line); padding-top: 14px; }
.side-foot .dim { color: var(--side-dim); }
.side .btn { background: transparent; color: var(--side-ink); border-color: var(--side-line); }
.side .btn:hover:not(:disabled) { background: var(--side-hover); }
.side .btn.primary { background: var(--bg); color: var(--accent); border-color: var(--bg); font-weight: 700; }
.side .btn.primary:hover:not(:disabled) { background: var(--accent-tint); }
.side .icon-btn { color: var(--side-ink); }
.side .icon-btn:hover { background: var(--side-hover); color: var(--side-ink); }
.side .link { color: var(--side-ink); }
.clock { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.clock-time { font-size: 1.3rem; }
.clock-actions { display: flex; gap: 6px; }
.lang-toggle { justify-self: start; font-size: 0.95rem; }
.bell { position: relative; }
.bell .dot {
  position: absolute;
  top: 0;
  inset-inline-end: 0;
  background: #e5484d;
  color: #fff;
  font-size: 0.66rem;
  line-height: 16px;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  text-align: center;
  padding: 0 4px;
}
.inbox {
  position: absolute;
  inset-inline-start: calc(100% + 8px);
  top: 16px;
  width: 360px;
  max-height: calc(100vh - 40px);
  overflow: auto;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line-2);
  border-radius: var(--r-md);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
  z-index: 60;
}
.inbox-head { padding: 10px 14px; font-weight: 700; border-bottom: 1px solid var(--line); }

.content { min-width: 0; padding-block: 32px 48px; padding-inline: 40px max(40px, env(safe-area-inset-right, 0px)); }
.content-board { padding: 0; }
.page { display: grid; gap: 26px; max-width: 1160px; }
.page.narrow { max-width: 640px; }

/* ---------- page header ---------- */
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.ph-text { display: grid; gap: 4px; min-width: 0; }
.ph-meta { color: var(--ink-2); }
.ph-actions { display: flex; gap: 8px; }
.block { display: grid; gap: 10px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.block-head h2 .dim { font-weight: 400; }
.count { margin-inline-start: 8px; }
.alert-bar { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 16px; margin-bottom: 22px; max-width: 1160px; background: var(--red-tint); color: var(--red); border-radius: var(--r-sm); }
.alert-bar .link { color: var(--red); font-weight: 600; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 38px;
  padding: 0 16px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  background: var(--bg);
  color: var(--ink);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 0.88rem; }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.icon-btn { border: 0; background: none; border-radius: var(--r-sm); padding: 6px; cursor: pointer; display: inline-flex; color: var(--ink-2); }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-align: start; }
.link.name { color: var(--ink); text-decoration-color: var(--line-2); }
.link.name:hover { text-decoration-color: currentColor; }
.select, .input {
  width: 100%;
  height: 38px;
  padding: 0 10px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  background: var(--bg);
  color: var(--ink);
  min-width: 0;
}
.select.sm { height: 32px; width: auto; max-width: 260px; font-size: 0.88rem; }
.input:focus, .select:focus { outline: 2px solid var(--focus); outline-offset: 0; }
.search { display: flex; align-items: center; gap: 6px; height: 36px; border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 0 10px; flex: 0 1 280px; min-width: 0; color: var(--ink-3); }
.search input { border: 0; background: none; outline: none; width: 100%; min-width: 0; color: var(--ink); }
.filters { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.tabs { display: flex; gap: 20px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 6px 0; border-bottom: 2px solid transparent; color: var(--ink-2); cursor: pointer; font-weight: 500; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.field { display: grid; gap: 4px; flex: 1 1 220px; }
.form { display: grid; gap: 16px; }
.form-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.radios { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.radios.inline { display: flex; flex-wrap: wrap; gap: 6px 20px; }
.radios.inline legend { width: 100%; margin-bottom: 4px; }
.radios legend { padding: 0; margin-bottom: 2px; }
.radio, .check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.radio input, .check input { margin: 4px 0 0; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.checks { display: grid; gap: 10px; }
.driver-opt { padding: 10px 0; border-bottom: 1px solid var(--line); }
.driver-opt > span:nth-of-type(1) { flex: 1; min-width: 0; }
.opt-where { display: block; }
.opt-eta { display: grid; justify-items: end; text-align: end; }

/* ---------- status ---------- */
.status { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 2px; background: currentColor; flex: none; }
.s-grey { color: var(--ink-2); }
.s-grey i { background: var(--ink-3); }
.s-amber { color: var(--amber); }
.s-blue { color: var(--blue); }
.s-done { color: var(--ink-2); }
.s-done i { background: var(--accent); }
.s-red { color: var(--red); font-weight: 700; }

/* ---------- tables ---------- */
.table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); }
.table { width: 100%; border-collapse: collapse; min-width: 680px; }
.table th {
  text-align: start;
  font-weight: 500;
  font-size: 0.82rem;
  color: var(--ink-2);
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.table td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: baseline; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: var(--hover); }
.table th.r, .table td.r { text-align: end; white-space: nowrap; }
.actions-col { width: 1%; white-space: nowrap; }
.row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.empty-row td { color: var(--ink-2); padding: 20px 16px; }

/* ---------- drawer, modal ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 80; display: flex; justify-content: flex-end; }
.scrim.center { justify-content: center; align-items: flex-start; padding: 8vh 16px 16px; }
.drawer {
  width: min(460px, 100%);
  height: 100%;
  background: var(--bg);
  border-inline-start: 1px solid var(--line-2);
  display: flex;
  flex-direction: column;
  outline: none;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { font-size: 1.2rem; margin-bottom: 4px; }
.drawer-body { overflow-y: auto; flex: 1; }
.d-sec { padding: 18px 22px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.d-sec:last-child { border-bottom: 0; }
.d-sec .btn.primary { justify-self: start; }
.modal { width: min(520px, 100%); max-height: 86vh; overflow: auto; background: var(--bg); border: 1px solid var(--line-2); border-radius: var(--r-md); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16); outline: none; }
.modal-body { padding: 18px 22px 22px; display: grid; gap: 16px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.modal-actions.start { justify-content: flex-start; }
.dl { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 14px; margin: 0; }
.dl dt { color: var(--ink-2); }
.dl dd { margin: 0; }
.note { padding: 10px 12px; border-radius: var(--r-sm); background: var(--sunk); }
.note.amber { background: var(--amber-tint); color: var(--amber); }
.note.red { background: var(--red-tint); color: var(--red); }
.steps-row { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.steps-row li { display: grid; gap: 2px; padding-top: 8px; border-top: 3px solid var(--line); color: var(--ink-3); font-size: 0.8rem; }
.steps-row li.done { border-top-color: var(--accent); color: var(--ink); }
.steps-time { font-size: 0.82rem; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.timeline li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; }
.timeline time { color: var(--ink-2); }
.privacy { display: grid; gap: 4px; }
.privacy p { margin-bottom: 8px; }
.notices { list-style: none; margin: 0; padding: 0; }
.notice { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; width: 100%; text-align: start; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 14px; cursor: pointer; color: var(--ink); }
.notice:hover { background: var(--hover); }
.notice-icon { color: var(--ink-3); padding-top: 2px; }
.n-warn .notice-icon { color: var(--amber); }
.n-good .notice-icon { color: var(--accent); }
.notice-time { font-size: 0.78rem; white-space: nowrap; }
.result { display: grid; gap: 12px; padding: 18px; border: 1px solid var(--line); border-radius: var(--r-md); }
.result-name { font-size: 1.1rem; font-weight: 700; }

/* ---------- recovery ward: departures board ---------- */
.board { min-height: 100vh; background: var(--b-bg); color: var(--b-text); display: flex; flex-direction: column; color-scheme: dark; }
.board-full { position: fixed; inset: 0; z-index: 70; overflow: auto; padding-top: env(safe-area-inset-top, 0px); }
.board-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 26px 32px 18px; border-bottom: 1px solid var(--b-line); }
.board-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; font-size: 1.8rem; font-weight: 700; }
.board-ar { font-weight: 500; color: var(--b-dim); font-size: 1.3rem; }
.board-sub { color: var(--b-dim); margin-top: 4px; }
.board-right { display: flex; align-items: center; gap: 18px; }
.board-clock { font-size: 2.6rem; color: var(--b-yellow); line-height: 1; letter-spacing: 0.02em; }
.board-btn { display: inline-flex; gap: 6px; align-items: center; height: 34px; padding: 0 12px; background: none; border: 1px solid var(--b-line); border-radius: var(--r-sm); color: var(--b-text); cursor: pointer; }
.board-btn:hover { border-color: var(--b-dim); }
.board-summary { display: flex; gap: 28px; flex-wrap: wrap; padding: 12px 32px; border-bottom: 1px solid var(--b-line); color: var(--b-dim); font-size: 0.95rem; }
.board-summary b { color: var(--b-text); font-weight: 500; font-size: 1.1rem; }
.board-summary .b-red, .board-summary .b-red b { color: var(--b-red); }
.board-scroll { overflow-x: auto; flex: 1; }
.board-table { width: 100%; border-collapse: collapse; min-width: 820px; font-size: 1.05rem; }
.board-table th {
  vertical-align: bottom;
  text-align: start;
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--b-dim);
  padding: 12px 16px;
  border-bottom: 1px solid var(--b-line);
  white-space: nowrap;
}
:root[lang="en"] .board-table th { font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; }
.board-table th span { display: block; margin-top: 3px; text-transform: none; letter-spacing: 0; font-size: 0.78rem; font-weight: 500; opacity: 0.7; }
.board-table td { padding: 15px 16px; border-bottom: 1px solid var(--b-line); white-space: nowrap; }
.board-table tbody tr { cursor: pointer; }
.board-table tbody tr:nth-child(even) td { background: var(--b-row); }
.board-table tbody tr:hover td { background: #1a1e1b; }
.board-table .c-time { width: 1%; }
.board-table td.c-time { color: var(--b-yellow); }
.board-table .c-num { text-align: end; width: 1%; }
.b-name { font-weight: 600; }
.b-chair { margin-inline-start: 8px; color: var(--b-yellow); }
.b-dim { color: var(--b-dim); }
.b-status { font-weight: 600; }
.b-amber { color: var(--b-yellow); }
.b-red { color: var(--b-red); }
.b-green { color: var(--b-green); }
.b-white { color: var(--b-text); }
.b-wait { font-size: 1.25rem; }
.b-est { color: var(--b-dim); }
.row-late td { background: rgba(255, 95, 82, 0.08) !important; }
.row-left td { color: #5d625e; }
.row-left td.c-time { color: #6f6a55; }
.b-empty { color: var(--b-dim); padding: 28px 16px !important; }
.board-foot { padding: 14px 32px 20px; color: var(--b-dim); font-size: 0.88rem; border-top: 1px solid var(--b-line); }

/* ---------- driver phone ---------- */
.driver-layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 32px; align-items: start; }
.phone { border: 1px solid var(--line-2); border-radius: 28px; padding: 10px; background: var(--sunk); }
.phone-status { display: flex; justify-content: space-between; padding: 6px 14px 10px; color: var(--ink-2); font-size: 0.78rem; }
.phone-body { display: grid; gap: 10px; min-height: 420px; align-content: start; }
.phone-empty { color: var(--ink-2); padding: 40px 18px; text-align: center; }
.trip { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.trip-late { border-color: var(--red); }
.trip-step { font-size: 0.8rem; font-weight: 700; color: var(--accent); }
.trip-name { font-size: 1.2rem; font-weight: 700; line-height: 1.3; }
.trip-co { color: var(--ink-2); margin-top: -6px; }
.trip-legs { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px 8px; margin: 0; }
.trip-legs dt { color: var(--ink-3); }
.trip-legs dd { margin: 0; }
.trip-phone { display: block; color: var(--ink-2); text-align: start; }
.trip-flag { color: var(--blue); font-weight: 600; }
.trip-q { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.trip-est { font-weight: 400; font-size: 0.82rem; color: var(--ink-2); }
.eta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.eta button { height: 42px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg); cursor: pointer; font-weight: 500; }
.eta button.on { border-color: var(--accent); background: var(--accent-tint); color: var(--accent); font-weight: 700; }
.trip-btn { height: 50px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1rem; cursor: pointer; }
.trip-btn:hover { background: var(--accent-hover); }
.trip-due { color: var(--ink-2); }
.trip-due.late { color: var(--red); font-weight: 600; }

/* ---------- demo mode ---------- */
.demo-start { width: 100%; }
.sms-btn { justify-content: space-between; }
.sms-btn.on { background: var(--side-hover); }
.sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-inline-end: 6px; background: var(--side-dim); vertical-align: 1px; }
.sync-dot.shared { background: #8ff0b8; }
.content.with-demo { padding-bottom: 160px; }
.content-board.with-demo { padding-bottom: 136px; }
.with-demo .drawer-body { padding-bottom: 150px; }
.with-demo .board-full { padding-bottom: 136px; }
.demo-bar {
  position: fixed;
  inset-inline-start: 264px;
  inset-inline-end: 0;
  bottom: 0;
  z-index: 85;
  background: var(--bg);
  border-top: 1px solid var(--line-2);
  box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.1);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.demo-progress { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; height: 4px; }
.demo-progress span { background: var(--line); }
.demo-progress span.on { background: var(--accent); }
.demo-main { display: flex; gap: 20px; align-items: center; justify-content: space-between; padding: 14px 28px 16px; flex-wrap: wrap; }
.demo-text { display: grid; gap: 4px; flex: 1 1 420px; min-width: 0; }
.demo-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.demo-title b { font-size: 1.1rem; font-weight: 700; }
.demo-count { color: var(--ink-2); }
.demo-where { font-size: 0.8rem; font-weight: 700; color: var(--accent); }
:root[lang="en"] .demo-where { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.75rem; }
.demo-caption { color: var(--ink-2); max-width: 80ch; border: 0; background: none; padding: 0; margin: 0; text-align: start; font: inherit; cursor: default; }
.demo-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.demo-follow { display: flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 0.88rem; margin-inline-end: 6px; cursor: pointer; }
.demo-follow input { accent-color: var(--accent); }

/* ---------- simulated SMS ---------- */
.sms-panel {
  position: fixed;
  inset-inline-end: max(16px, env(safe-area-inset-right, 0px));
  bottom: 16px;
  width: 350px;
  max-width: calc(100vw - 32px);
  max-height: min(560px, calc(100vh - 32px));
  display: flex;
  flex-direction: column;
  background: var(--sunk);
  border: 1px solid var(--line-2);
  border-radius: 20px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);
  z-index: 86;
  overflow: hidden;
}
.content.with-demo ~ .sms-panel { bottom: 150px; max-height: min(520px, calc(100vh - 170px)); }
.sms-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 10px 10px 16px; padding-inline: 16px 10px; border-bottom: 1px solid var(--line); font-weight: 700; }
.sms-list { overflow-y: auto; padding: 12px; display: grid; gap: 12px; align-content: start; flex: 1; }
.sms-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 0.76rem; color: var(--ink-2); margin-bottom: 4px; }
.sms-bubble { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; border-end-start-radius: 4px; padding: 9px 12px; font-size: 0.92rem; }
.sms-empty { padding: 20px 4px; text-align: center; }
.sms-foot { padding: 8px 16px 12px; border-top: 1px solid var(--line); }
.sms-toast {
  position: fixed;
  inset-inline-end: max(16px, env(safe-area-inset-right, 0px));
  top: calc(16px + env(safe-area-inset-top, 0px));
  width: 350px;
  max-width: calc(100vw - 32px);
  display: grid;
  gap: 4px;
  text-align: start;
  padding: 12px 14px;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line-2);
  border-radius: 14px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
  z-index: 90;
  cursor: pointer;
  animation: toast-in 0.25s ease-out;
}
.sms-toast-to { font-size: 0.8rem; font-weight: 700; color: var(--accent); }
.sms-toast-text { font-size: 0.92rem; line-height: 1.5; max-height: 4.5em; overflow: hidden; }
@keyframes toast-in { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- narrow screens: the sidebar becomes a top bar with a menu button ---------- */
@media (max-width: 860px) {
  .shell { display: block; }
  .side {
    position: sticky;
    top: 0;
    height: auto;
    gap: 0;
    padding-block: calc(10px + env(safe-area-inset-top, 0px)) 10px;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    overflow: visible;
    z-index: 50;
  }
  .side-top { height: 36px; align-items: center; gap: 10px; }
  .wordmark { flex: none; }
  .wm { font-size: 1.6rem; }
  :root[lang="en"] .wm { font-size: 1.35rem; }
  .wm-sub { display: none; }
  .side-current { display: block; flex: 1; min-width: 0; font-size: 0.85rem; color: var(--side-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-current b { color: var(--side-ink); font-weight: 600; }
  .side .menu-btn { display: inline-flex; }
  .side-panel { display: none; }
  .side.open .side-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: fixed;
    top: calc(56px + env(safe-area-inset-top, 0px));
    inset-inline: 0;
    bottom: 0;
    overflow-y: auto;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: var(--side);
    border-top: 1px solid var(--side-line);
    z-index: 55;
  }
  .side-who { grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 10px; }
  .side-plan { grid-column: 1 / -1; }
  .side-foot { margin-top: 0; }
  .inbox { position: fixed; inset-inline: 12px; width: auto; top: calc(60px + env(safe-area-inset-top, 0px)); max-height: 70vh; }
  .content { padding-block: 22px 40px; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  .content-board { padding: 0; }
  .board { min-height: 70vh; }
  .board-head, .board-summary, .board-foot { padding-inline: 16px; }
  .board-clock { font-size: 2rem; }
  .driver-layout { grid-template-columns: minmax(0, 1fr); }
  .phone { max-width: 380px; }
  .table th, .table td { white-space: nowrap; }
  .drawer { width: 100%; }

  /* demo bar: compact, caption expands on tap */
  .demo-bar { inset-inline-start: 0; }
  .demo-main { padding: 8px 14px 10px; gap: 8px; }
  .demo-text { flex-basis: 100%; gap: 2px; }
  .demo-title b { font-size: 1rem; }
  .demo-caption { font-size: 0.86rem; line-height: 1.5; max-height: 3em; overflow: hidden; cursor: pointer; }
  .demo-caption.open { max-height: none; }
  .demo-actions { width: 100%; justify-content: space-between; }
  .demo-actions .demo-follow { margin-inline-end: auto; }
  .content.with-demo { padding-bottom: 170px; }
  .content-board.with-demo, .with-demo .drawer-body { padding-bottom: 160px; }
  .content.with-demo ~ .sms-panel { bottom: 150px; max-height: calc(100vh - 230px); }

  /* SMS pop-up: a slim strip under the top bar */
  .sms-toast { top: calc(62px + env(safe-area-inset-top, 0px)); inset-inline: 12px; width: auto; max-width: none; padding: 8px 12px; gap: 2px; border-radius: 10px; }
  .sms-toast-to { font-size: 0.75rem; }
  .sms-toast-text { font-size: 0.85rem; max-height: 3em; }
  .sms-panel { inset-inline: 12px; width: auto; max-width: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
